<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://sunleonbags.com/" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/aac57e02c4.js"
      crossorigin="anonymous"
    ></script>
    <title>FAQ & Information</title>
  </head>
  <body>
    <div id="header"></div>
    <main class="faq_page">
      <section class="faq_hero">
        <h1 class="faq_title" data-key="faq_title"></h1>

        <p class="faq_subtitle" data-key="faq_subtitle"></p>
      </section>

      <section class="faq_bento">
        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-bag-shopping"></i>
          <h2 data-key="faq_order_title"></h2>

          <p data-key="faq_order_text"></p>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-leaf"></i>
          <h2 data-key="faq_material_title"></h2>

          <p data-key="faq_material_text"></p>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-industry"></i>

          <h2 data-key="faq_origin_title"></h2>

          <p data-key="faq_origin_text"></p>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-shield-halved"></i>

          <h2 data-key="faq_warranty_title"></h2>

          <p data-key="faq_warranty_text"></p>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-box-open"></i>

          <h2 data-key="faq_stock_title"></h2>

          <p data-key="faq_stock_text"></p>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-palette"></i>

          <h2 data-key="faq_colors_title"></h2>

          <p data-key="faq_colors_text"></p>
        </article>

        <article class="faq_card faq_card_large fade-in">
          <i class="faq_icon fa-solid fa-truck-fast"></i>

          <h2 data-key="faq_delivery_title"></h2>

          <div class="static_shipping"></div>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-credit-card"></i>

          <h2 data-key="faq_payment_title"></h2>

          <div class="static_payment"></div>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-arrow-rotate-left"></i>

          <h2 data-key="faq_returns_title"></h2>

          <div class="static_returns"></div>
        </article>

        <article class="faq_card faq_card_large fade-in">
          <i class="faq_icon fa-solid fa-hand-sparkles"></i>

          <h2 data-key="faq_care_title"></h2>

          <div class="static_care"></div>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-ruler"></i>

          <h2 data-key="faq_sizes_title"></h2>

          <p data-key="faq_sizes_text"></p>
        </article>

        <article class="faq_card fade-in">
          <i class="faq_icon fa-solid fa-sun"></i>

          <h2 data-key="faq_about_title"></h2>

          <p data-key="faq_about_text"></p>
        </article>

        <article class="faq_card faq_card_full fade-in">
          <h2 data-key="faq_why_title"></h2>

          <div class="why_cards">
            <div class="why_card">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span data-key="why_1"></span>
            </div>

            <div class="why_card">
              <i class="fa-solid fa-palette"></i>
              <span data-key="why_2"></span>
            </div>

            <div class="why_card">
              <i class="fa-solid fa-gem"></i>
              <span data-key="why_3"></span>
            </div>

            <div class="why_card">
              <i class="fa-solid fa-shield-halved"></i>
              <span data-key="why_4"></span>
            </div>

            <div class="why_card">
              <i class="fa-solid fa-truck-fast"></i>
              <span data-key="why_5"></span>
            </div>
          </div>
        </article>
      </section>
    </main>
    <footer id="footer" class="fade-in"></footer>
    <script src="common.js"></script>
  </body>
</html>
