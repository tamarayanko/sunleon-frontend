    />

  <body>
    <div class="main_container">
      <div id="header"></div>
      <section class="hero_section fade-in">
        <img src="assets/nowhero1.jpg" alt="New Arrivals" class="hero_image" />
        <div class="hero_overlay">
          <a href="#" class="hero_category_btn">New Arrivals</a>
        </div>
      </section>
      <section class="sales fade-in"></section>
      <section class="shop_by_category_section fade-in">
        <div class="section_header">
          <h2 class="section_title" data-key="shop_by_category">
            Shop By Category
          </h2>
        </div>

        <div class="shop_by_category" id="shop-by-category"></div>
      </section>
      <section class="video_review_section fade-in">
        <div class="section_header">
          <h2 class="section_title" data-key="real_life">Real Life</h2>
        </div>
        <section class="video_review"></section>
      </section>
      <section class="best_sellers_section fade-in">
        <h2 class="best_sellers_title" data-key="bestsellers">Bestsellers</h2>

        <section class="best_sellers"></section>
      </section>

    <footer id="footer" class="fade-in"></footer>
    <script src="common.js"></script>
    <script src="script.js"></script>
